# Test configuration: replaces src/main/resources/application.properties on the test classpath.
spring.application.name=pulsegate

spring.datasource.url=jdbc:postgresql://localhost:55432/pulsegate_test?reWriteBatchedInserts=true
spring.datasource.username=pulsegate
spring.datasource.password=pulsegate

# Fresh schema for every test run.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

pulsegate.admin.token=test-admin-token

# Redis (docker compose) for the Redis limiter tests; database 1 keeps test keys apart from dev.
spring.data.redis.host=localhost
spring.data.redis.port=56379
spring.data.redis.database=1
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=500ms

# Synchronous event writes: tests check events right after each request.
# The async path has its own tests (RequestEventRecorderTest).
pulsegate.events.async=false

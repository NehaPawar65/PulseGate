spring.application.name=pulsegate

spring.datasource.url=jdbc:postgresql://localhost:55432/pulsegate
spring.datasource.username=pulsegate
spring.datasource.password=pulsegate

spring.jpa.hibernate.ddl-auto=update
# Off: logging every SQL statement distorts latency measurements. Turn on when debugging queries.
spring.jpa.show-sql=false

spring.jpa.open-in-view=false

# Origins allowed to call /api/** from a browser (Vite dev server).
pulsegate.cors.allowed-origins=http://localhost:5173

springdoc.swagger-ui.path=/swagger-ui.html

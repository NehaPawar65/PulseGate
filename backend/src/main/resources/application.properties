spring.application.name=pulsegate

spring.datasource.url=jdbc:postgresql://localhost:55432/pulsegate?reWriteBatchedInserts=true
spring.datasource.username=pulsegate
spring.datasource.password=pulsegate

spring.jpa.hibernate.ddl-auto=update
# Off: logging every SQL statement distorts latency measurements. Turn on when debugging queries.
spring.jpa.show-sql=false

spring.jpa.open-in-view=false

# Bearer token for the admin APIs. Set PULSEGATE_ADMIN_TOKEN; if unset, a random token is printed at startup.
pulsegate.admin.token=${PULSEGATE_ADMIN_TOKEN:}

# Where quota state lives: "memory" (single instance, default) or "redis" (shared by all instances).
pulsegate.limiter.store=${PULSEGATE_LIMITER_STORE:memory}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:56379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=500ms

# Failed API-key attempts allowed per client IP (token bucket). Once used up, that IP gets 429
# without any database work until an attempt refills.
pulsegate.invalid-key.capacity=30
pulsegate.invalid-key.refill-per-second=1.0

# Request events are queued and written in batches by a background thread (bounded queue;
# events are dropped and counted if it fills, so the gateway never waits on the database).
pulsegate.events.async=true
pulsegate.events.queue-capacity=10000
pulsegate.events.batch-size=500

# Known clients are cached in memory; policy edits clear this instance's cache immediately.
pulsegate.client-cache.ttl=30s

# Origins allowed to call /api/** from a browser (Vite dev server).
pulsegate.cors.allowed-origins=http://localhost:5173

springdoc.swagger-ui.path=/swagger-ui.html

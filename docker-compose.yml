services:
  db:
    image: postgres:16
    container_name: pulsegate-db
    environment:
      POSTGRES_DB: pulsegate
      POSTGRES_USER: pulsegate
      POSTGRES_PASSWORD: pulsegate
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro

  # Shared quota store, used when PULSEGATE_LIMITER_STORE=redis (several gateway instances).
  # No volume: quota state is short-lived by design.
  redis:
    image: redis:7
    container_name: pulsegate-redis
    ports:
      - "56379:6379"

volumes:
  pgdata:

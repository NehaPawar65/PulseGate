services:
  db:
    image: postgres:16
    container_name: pulsegate-db
    environment:
      POSTGRES_DB: pulsegate
      POSTGRES_USER: pulsegate
      POSTGRES_PASSWORD: pulsegate
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
